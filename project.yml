# XcodeGen spec: the source of truth for {{APP_NAME}}.xcodeproj. Run `make generate`.
# The .xcodeproj is NOT committed (it is in .gitignore): CI and the release lanes
# always generate it, so a stale or badly merged pbxproj can't reach a build.
# Never edit the generated project in Xcode; every change goes here. Why every
# Info.plist key, version and entitlement lives in this file:
# docs/xcodegen-regen-defenses.md.
name: {{APP_NAME}}

options:
  bundleIdPrefix: {{BUNDLE_ID_PREFIX}}
  deploymentTarget:
    # The Makefile reads this line (4-space indent) to choose the test simulator.
    iOS: "{{IOS_DEPLOYMENT_TARGET}}"
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    # Pinned at the project base so every target (app, extensions, watch app)
    # ships aligned: App Store Connect rejects an extension or embedded watch app
    # whose version differs from its host's, and installd rejects an appex with an
    # empty CFBundleVersion. NEVER override these per target. The
    # release-to-testflight skill bumps CURRENT_PROJECT_VERSION on this line, and
    # release.yml reads it at this 4-space indent.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Pinned so a fresh clone (and the runner) signs without per-Mac setup; a
    # team left to Local.xcconfig regenerates as empty and Xcode drops the
    # capabilities from Signing & Capabilities.
    DEVELOPMENT_TEAM: {{TEAM_ID}}
    CODE_SIGN_STYLE: Automatic
    # Automatic signing upgrades to Distribution for archives. The legacy
    # "iPhone Developer" hint pins archives to Development certificates.
    CODE_SIGN_IDENTITY: "Apple Development"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    GENERATE_INFOPLIST_FILE: YES

packages:
  # Foundation-only domain logic: `make test-core` runs it with plain `swift test`.
  {{MODULE_NAME}}Core:
    path: Packages/{{MODULE_NAME}}Core

targets:
  {{APP_NAME}}:
    type: application
    platform: iOS
    sources:
      - path: {{APP_NAME}}
    dependencies:
      - package: {{MODULE_NAME}}Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: {{BUNDLE_ID}}
        # Info.plist keys as INFOPLIST_KEY_* build settings (or `info.properties`
        # below): a key typed into the generated plist is lost on the next regen.
        INFOPLIST_KEY_CFBundleDisplayName: "{{DISPLAY_NAME}}"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        # iPad must list all four, or App Store Connect rejects the upload (multitasking).
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        # Stop the destination picker re-adding Mac / visionOS on every regen.
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        TARGETED_DEVICE_FAMILY: "1,2"
    # Entitlements live here, not only in the .entitlements file: XcodeGen
    # rewrites the file from these properties on every regen.
    # entitlements:
    #   path: {{APP_NAME}}/{{APP_NAME}}.entitlements
    #   properties:
    #     com.apple.security.application-groups: [group.{{BUNDLE_ID}}]

  {{APP_NAME}}Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: {{APP_NAME}}Tests
    dependencies:
      - target: {{APP_NAME}}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: {{BUNDLE_ID}}.tests
        GENERATE_INFOPLIST_FILE: YES

  {{APP_NAME}}UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: {{APP_NAME}}UITests
    dependencies:
      - target: {{APP_NAME}}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: {{BUNDLE_ID}}.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: {{APP_NAME}}

schemes:
  # The merge gate: unit tests only.
  {{APP_NAME}}:
    build:
      targets:
        {{APP_NAME}}: all
    test:
      targets:
        - {{APP_NAME}}Tests
      gatherCoverageData: true
    archive:
      config: Release
  # Nightly, off the gate (ui-tests.yml).
  {{APP_NAME}}UITests:
    build:
      targets:
        {{APP_NAME}}: all
    test:
      targets:
        - {{APP_NAME}}UITests
